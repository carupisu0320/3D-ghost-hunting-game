<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>ロビー - 3D Ghost Hunting Game</title>
    <link rel="stylesheet" href="lobby.css" />
    <link rel="stylesheet" href="help.css" />
    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/",
        "socket.io-client": "https://cdn.socket.io/4.7.5/socket.io.esm.min.js"
      }
    }
    </script>
  </head>
  <body>
    <div id="crosshair"></div>
    <div id="roomBadge"></div>
    <div id="hint">
      <div class="title">ゴーストハンティング ロビー</div>
      <div class="sub" id="hintText">クリックして歩き回る<br />WASD: 移動 / Shift: 走る / マウス: 見回す / Esc: 一時停止(クリックかWASDで再開)<br />奥の工房のホワイトボードで、部屋づくり・参加・マップ選択ができます<br />工房の壁のボードから道具を取って(クリック)、ガレージのテスト用ゴーストで試せます<br />H: 操作説明を開く(キーの一覧・コントローラーの操作。いつでも開けます)<br />(コントローラーのボタンを押すと、クリックしなくても始まります)</div>
    </div>
    <div id="helpPanel"></div>
    <div id="resume"><div class="box"><div class="big">クリックで操作を再開</div><div class="small">(WASDなどのキーでも再開できます / Esc: 一時停止 / H: 操作説明)</div></div></div>
    <div id="toast"></div>
    <div id="modal">
      <div id="modalBox">
        <h2 id="modalTitle"></h2>
        <input id="modalInput" type="text" autocomplete="off" />
        <div id="modalError"></div>
        <div class="modalButtons"><button id="modalCancel">やめる</button><button id="modalOk">決定</button></div>
      </div>
    </div>

    <script type="module" src="lobby.js"></script>
  </body>
</html>
