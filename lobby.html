<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>ロビー - 3D Ghost Hunting Game</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif; }
      canvas { display: block; }

      /* 画面の中央の照準(ボードのボタンを狙うための点) */
      #crosshair {
        position: fixed; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%;
        background: rgba(255,255,255,0.85); box-shadow: 0 0 0 1px rgba(0,0,0,0.5); z-index: 5; pointer-events: none; display: none;
      }
      /* 「クリックして始める」の案内(カーソルが出ている間だけ表示) */
      #hint {
        position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
        background: rgba(0,0,0,0.55); color: #eee; cursor: pointer; text-align: center;
      }
      #hint .title { font-size: 30px; letter-spacing: 3px; color: #9fd3ff; }
      #hint .sub { font-size: 15px; color: #ccc; line-height: 1.8; }
      #toast {
        position: fixed; left: 50%; bottom: 36px; transform: translateX(-50%); z-index: 30; display: none;
        background: rgba(20,20,26,0.92); color: #ffd0d0; border: 1px solid #5a3a3a; border-radius: 6px; padding: 10px 20px; font-size: 15px;
      }
      #roomBadge {
        position: fixed; top: 10px; left: 10px; z-index: 6; display: none; color: #cfe6ff; font-family: monospace; font-size: 14px;
        background: rgba(0,0,0,0.45); padding: 6px 12px; border-radius: 4px; line-height: 1.6;
      }

      /* 名前・部屋コードの入力ダイアログ */
      #modal { position: fixed; inset: 0; z-index: 40; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,0.6); }
      #modalBox { background: #16181d; border: 1px solid #3a3f4a; border-radius: 8px; padding: 24px 28px; width: 320px; color: #eee; }
      #modalTitle { font-size: 18px; margin: 0 0 14px; color: #9fd3ff; }
      #modalInput {
        width: 100%; box-sizing: border-box; padding: 10px 12px; margin-bottom: 8px; background: #23262d; border: 1px solid #444a55;
        border-radius: 4px; color: #fff; font-size: 18px; letter-spacing: 2px;
      }
      #modalError { color: #ff8a8a; font-size: 13px; min-height: 18px; margin-bottom: 8px; }
      .modalButtons { display: flex; gap: 10px; }
      .modalButtons button { flex: 1; padding: 10px; border: none; border-radius: 4px; font-size: 15px; cursor: pointer; }
      #modalOk { background: #3a7ad9; color: #fff; }
      #modalCancel { background: #2c2f38; color: #ddd; }
    </style>
    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"
      }
    }
    </script>
  </head>
  <body>
    <div id="crosshair"></div>
    <div id="roomBadge"></div>
    <div id="hint">
      <div class="title">ゴーストハンティング ロビー</div>
      <div class="sub">クリックして歩き回る<br />WASD: 移動 / Shift: 走る / マウス: 見回す / Esc: カーソルを出す<br />奥の工房のホワイトボードで、部屋づくり・参加・マップ選択ができます<br />工房の壁のボードから道具を取って(クリック)、ガレージのテスト用ゴーストで試せます<br />1〜3: 持ち替え / E: 使う / Q: ボードに戻す</div>
    </div>
    <div id="toast"></div>
    <div id="modal">
      <div id="modalBox">
        <h2 id="modalTitle"></h2>
        <input id="modalInput" type="text" autocomplete="off" />
        <div id="modalError"></div>
        <div class="modalButtons"><button id="modalCancel">やめる</button><button id="modalOk">決定</button></div>
      </div>
    </div>

    <script type="module" src="lobby.js"></script>
  </body>
</html>
